# Replace both placeholders after `cloudflared tunnel create cyber-dm`.
# This Mac's network stalls large uploads over QUIC; use HTTP/2 for the tunnel.
protocol: http2
tunnel: TUNNEL_UUID
credentials-file: /ABSOLUTE/PATH/TO/TUNNEL_UUID.json
ingress:
  - hostname: cyber-dm.caotc.org
    service: http://127.0.0.1:3001
  - service: http_status:404
